services:
  postgrya:
    image: postgres:15
    container_name: postgrya
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - app_db_data:/var/lib

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADM_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADM_PASS}
    ports:
      - "5050:80"
    depends_on:
      - postgrya

  redis:
    image: redis:7.4
    container_name: cache
    restart: "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    volumes:
      - cache_data:/data

volumes:
  cache_data:
  app_db_data:
